<script>
  (function renderUpcomingEvents(){
    const grid = document.getElementById('upcomingGrid');
    const empty = document.getElementById('upcomingEmpty');
    empty.style.display = UPCOMING_EVENTS.length ? 'none' : '';
    UPCOMING_EVENTS.forEach(function(ev){
      const card = document.createElement('div');
      card.className = 'event-card';
      const ticketsHtml = ev.ticketUrl
        ? '<a class="event-tickets event-tickets-active" href="' + ev.ticketUrl + '" target="_blank" rel="noopener">Comprar entradas →</a>'
        : '<span class="event-tickets event-tickets-pending">Entradas próximamente</span>';
      card.innerHTML =
        '<div class="event-card-body">' +
          '<div class="event-date">' + ev.dateLabel + '</div>' +
          '<h3 class="event-name">' + ev.name + '</h3>' +
          '<div class="event-venue">' + ev.venue + '</div>' +
          '<div class="event-lineup">' + ev.lineup + '</div>' +
        '</div>' +
        ticketsHtml;
      grid.appendChild(card);
    });
  })();

  fetch('assets/flyers/_events.json')
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(renderPastEvents)
    .catch(function(){ renderPastEvents([]); });

  function renderPastEvents(events){
    const grid = document.getElementById('flyerGrid');
    const empty = document.getElementById('pastEventsEmpty');
    if(!events || !events.length){
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    // Justified rows: each card's flex-basis is its natural width at a
    // shared target height, flex-grow uses that same aspect ratio so
    // flexbox's per-line free-space distribution stretches every card in
    // a row to one exact shared height (browser math, no row-packing JS
    // needed — flex-wrap already breaks lines on its own). The image's own
    // aspect-ratio (not a fixed box) means nothing gets cropped off the
    // sides the way a forced 3:4 box used to.
    const TARGET_HEIGHT = 220;
    events.slice().reverse().forEach(function(ev){
      const card = document.createElement('div');
      card.className = 'flyer-card';
      const aspect = ev.aspect || 1;
      card.style.flexGrow = String(aspect);
      card.style.flexBasis = (TARGET_HEIGHT * aspect) + 'px';
      const dateObj = new Date((ev.date || '').slice(0,10) + 'T00:00:00');
      const dateLabel = isNaN(dateObj) ? (ev.date || '') : dateObj.toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' });
      card.innerHTML =
        '<div class="flyer-cover" style="aspect-ratio:' + aspect + ';"><img src="assets/flyers/' + ev.flyer_file + '" alt="' + ev.name.replace(/"/g,'&quot;') + '" loading="lazy"></div>' +
        '<div class="flyer-meta">' +
          '<span class="flyer-name">' + ev.name + '</span>' +
          '<span class="flyer-date">' + dateLabel + (ev.venue ? ' — ' + ev.venue : '') + '</span>' +
          '<span class="flyer-bands">' + (ev.bands || []).join(', ') + '</span>' +
        '</div>';
      card.addEventListener('click', function(){
        document.getElementById('flyerLightboxImg').src = 'assets/flyers/' + ev.flyer_file;
        document.getElementById('flyerLightboxImg').alt = ev.name;
        document.getElementById('flyerLightbox').classList.add('open');
      });
      grid.appendChild(card);
    });
  }

  function closeFlyerLightbox(){
    document.getElementById('flyerLightbox').classList.remove('open');
  }
</script>

</body>
</html>
