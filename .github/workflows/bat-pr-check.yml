# Required status check for main's branch protection rule — merging is
# blocked (even for admins) until this job passes.
name: BAT PR check

on:
  pull_request:
    branches: [main]

jobs:
  bat:
    name: BAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chrome)
        run: npx playwright install --with-deps chrome

      - name: Run BAT subset
        run: npx playwright test --grep "@bat"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: tests/playwright-report/
          retention-days: 14
