# Required status check for main's branch protection rule — merging is
# blocked (even for admins) until this job passes.
name: BAT PR check

on:
  pull_request:
    branches: [main]

jobs:
  bat:
    name: BAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # releases-store.spec.js and youtube-store.spec.js both dynamically
      # import a netlify/lib/*.mts module at the repo root, which resolves
      # its @netlify/blobs import from the root node_modules — the tests/
      # install below doesn't cover it, since tests/ is a sibling directory,
      # not an ancestor. Deliberately bypasses the committed root
      # package-lock.json (which carries stale "extraneous" per-platform
      # Rollup entries from netlify-cli that make npm ci hard-fail with
      # EBADPLATFORM on Linux, even with --omit=dev) and does a fresh,
      # unlocked resolve of just the root "dependencies" instead —
      # @netlify/blobs has none of its own, so there's nothing else this
      # could pull in.
      - name: Install root dependencies
        working-directory: .
        run: npm install --no-save --package-lock=false --omit=dev

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chrome, Firefox, WebKit)
        run: npx playwright install --with-deps chrome firefox webkit

      - name: Run BAT subset
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: bat-results.json
        run: npx playwright test --grep "@bat" --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: tests/playwright-report/
          retention-days: 14

      # Every step below is best-effort only (continue-on-error) — none of
      # them may affect this job's pass/fail conclusion, since this workflow
      # is the required status check for merging to main. Only the "Run BAT
      # subset" step above should ever fail this check.
      - name: Build status summary
        if: always()
        continue-on-error: true
        run: node scripts/build-status-summary.js bat-results.json BAT bat-latest.json

      - name: Publish to sf-status dashboard
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: bash scripts/push-status.sh bat-latest.json data/bat-latest.json

      # Rolling history behind the admin portal's "ultimas 10 corridas"
      # chart. Best-effort like every other publish step here -- it must
      # never fail the required status check.
      - name: Append run to BAT history
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: |
          node scripts/append-status-history.js bat-latest.json data/bat-history.json bat-history.json
          bash scripts/push-status.sh bat-history.json data/bat-history.json
