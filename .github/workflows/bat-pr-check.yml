# Required status check for main's branch protection rule — merging is
# blocked (even for admins) until this job passes.
name: BAT PR check

on:
  pull_request:
    branches: [main]

jobs:
  bat:
    name: BAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # releases-store.spec.js and events-store.mts's future counterpart
      # import Netlify Functions modules straight from netlify/lib/*.mts at
      # the repo root, which resolve their own deps (e.g. @netlify/blobs)
      # from the root node_modules — the tests/ install below doesn't cover
      # it, since tests/ is a sibling directory, not an ancestor.
      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chrome, Firefox, WebKit)
        run: npx playwright install --with-deps chrome firefox webkit

      - name: Run BAT subset
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: bat-results.json
        run: npx playwright test --grep "@bat" --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: tests/playwright-report/
          retention-days: 14

      # Both steps below are best-effort only (continue-on-error) — they must
      # never affect this job's pass/fail conclusion, since this workflow is
      # the required status check for merging to main. Only the "Run BAT
      # subset" step above should ever fail this check.
      - name: Build status summary
        if: always()
        continue-on-error: true
        run: node scripts/build-status-summary.js bat-results.json BAT bat-latest.json

      - name: Publish to sf-status dashboard
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: bash scripts/push-status.sh bat-latest.json data/bat-latest.json
