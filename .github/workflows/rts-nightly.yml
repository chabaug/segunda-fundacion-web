name: RTS nightly

on:
  schedule:
    # 13:00 UTC = 10:00 ART (Argentina). Adjust as needed.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  rts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # releases-store.spec.js / youtube-store.spec.js dynamically import a
      # netlify/lib/*.mts module at the repo root (needs @netlify/blobs from
      # the root node_modules), and releases-api-live.spec.js /
      # auth-login-live.spec.js boot a real `netlify dev` (needs netlify-cli
      # itself) -- the tests/ install below doesn't cover either, since
      # tests/ is a sibling directory, not an ancestor. Unlike the BAT
      # workflow's lighter --omit=dev version of this same fix, RTS needs
      # the devDependencies too for netlify-cli. Deliberately bypasses the
      # committed root package-lock.json (which carries stale "extraneous"
      # per-platform Rollup entries from netlify-cli that make npm ci
      # hard-fail with EBADPLATFORM on Linux) and does a fresh, unlocked
      # resolve instead, which correctly skips incompatible-platform
      # optional deps the normal way.
      - name: Install root dependencies
        working-directory: .
        run: npm install --no-save --package-lock=false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chrome, Firefox, WebKit)
        run: npx playwright install --with-deps chrome firefox webkit

      - name: Run full regression suite (RTS)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: rts-results.json
          # releases-api-live.spec.js and auth-login-live.spec.js boot a real
          # `netlify dev`, which injects whatever's already in the process
          # env into the Functions it runs -- these dummy values match what
          # both spec files hardcode as their expected local-dev credentials
          # (see the repo's gitignored .env, which only exists on dev
          # machines, not in CI).
          EVENTS_ADMIN_TOKEN: local-dev-test-token
          CATALOG_ADMIN_TOKEN: local-dev-test-token
          EVENTS_ADMIN_USER: augusto
          EVENTS_ADMIN_PASSWORD: local-dev-test-password
        run: npx playwright test --project=desktop --project=mobile --project=firefox --project=webkit --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Build status summary
        if: always()
        continue-on-error: true
        run: node scripts/build-status-summary.js rts-results.json RTS rts-latest.json

      - name: Publish to sf-status dashboard
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: bash scripts/push-status.sh rts-latest.json data/rts-latest.json

      # Rolling history behind the admin portal's "ultimas 10 corridas"
      # chart. Reads the current history from sf-status, appends this run,
      # pushes it back.
      - name: Append run to RTS history
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: |
          node scripts/append-status-history.js rts-latest.json data/rts-history.json rts-history.json
          bash scripts/push-status.sh rts-history.json data/rts-history.json

      # Per-page test coverage. Published from the nightly only: it describes
      # the specs on main, not whatever a PR branch happens to carry.
      - name: Publish test coverage summary
        if: always()
        continue-on-error: true
        env:
          STATUS_REPO_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: |
          node scripts/build-coverage-summary.js coverage-latest.json
          bash scripts/push-status.sh coverage-latest.json data/coverage-latest.json
