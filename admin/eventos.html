<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Eventos — Segunda Fundación</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../assets/style.css?v=75">
<style>
  body{ background:var(--bg); color:var(--fg); font-family:'Neue Haas Grotesk Display Pro', Arial, Helvetica, sans-serif; margin:0; padding:0 0 80px; }
  .admin-wrap{ max-width:960px; margin:0 auto; padding:32px 20px; }
  .admin-header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .admin-header h1{ font-size:22px; color:var(--heading); margin:0; }
  .admin-header .sub{ font-size:13px; color:var(--heading); opacity:.75; }
  .btn{ font:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg-2); color:var(--fg); cursor:pointer; }
  .btn:hover{ border-color:var(--heading); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-accent:hover{ opacity:.9; }
  .btn-danger{ background:transparent; border-color:#B5502A; color:#B5502A; }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .section{ background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:20px; }
  .section h2{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--heading); margin:0 0 14px; }
  table.events-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.events-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--heading); padding:0 8px 8px; border-bottom:1px solid var(--line); }
  table.events-table td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .status-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; }
  .status-pill.active{ background:rgba(53,140,90,.15); color:#2E8358; }
  .status-pill.inactive{ background:rgba(0,0,0,.08); color:var(--heading); }
  .row-actions{ display:flex; gap:6px; }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field label{ font-size:12px; font-weight:700; color:var(--heading); }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=url], .field textarea{
    font:inherit; font-size:14px; padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--fg);
  }
  .field textarea{ min-height:100px; resize:vertical; }
  .field-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px 14px; }
  .field-grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  .subrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .subrow input{ flex:1; font:inherit; font-size:13px; padding:7px 9px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .list-add{ font-size:12px; }
  .flyer-preview{ width:110px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--bg); }
  .flyer-row{ display:flex; align-items:center; gap:14px; }
  .toggle{ position:relative; display:inline-block; width:38px; height:22px; }
  .toggle input{ opacity:0; width:0; height:0; }
  .toggle-slider{ position:absolute; inset:0; background:var(--line); border-radius:99px; cursor:pointer; transition:background .15s; }
  .toggle-slider:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; }
  .toggle input:checked + .toggle-slider{ background:var(--accent); }
  .toggle input:checked + .toggle-slider:before{ transform:translateX(16px); }
  #gate{ max-width:360px; margin:120px auto; text-align:center; }
  #gate input{ width:100%; box-sizing:border-box; font:inherit; padding:10px; border-radius:7px; border:1px solid var(--line); margin:14px 0; background:var(--bg-2); color:var(--fg); }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--heading); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px; font-weight:700; z-index:50; }
  #toast[hidden]{ display:none; }
  #toast.danger{ background:#B5502A; }
  #app[hidden]{ display:none; }
</style>
</head>
<body>

<div id="gate">
  <h1 style="color:var(--heading);font-size:18px;">Admin Eventos</h1>
  <p style="font-size:13px;color:var(--heading);">Ingresá el token de administración.</p>
  <input type="password" id="gateToken" placeholder="Token" autocomplete="off">
  <button class="btn btn-accent" id="gateSubmit" style="width:100%;">Entrar</button>
  <p id="gateError" style="color:#B5502A;font-size:12px;display:none;">Token inválido.</p>
</div>

<div class="admin-wrap" id="app" hidden>
  <div class="admin-header">
    <div>
      <h1>Eventos</h1>
      <div class="sub">Próximos shows — banner y tarjetas de segundafundacion.com.ar</div>
    </div>
    <button class="btn btn-accent" id="newEventBtn">+ Nuevo evento</button>
  </div>

  <div class="section">
    <h2>Listado</h2>
    <table class="events-table">
      <thead><tr><th>Evento</th><th>Fecha</th><th>Estado</th><th></th></tr></thead>
      <tbody id="eventsTbody"></tbody>
    </table>
  </div>

  <div class="section" id="formSection" hidden>
    <h2 id="formTitle">Nuevo evento</h2>
    <form id="eventForm">
      <div class="field-grid">
        <div class="field"><label>Nombre</label><input type="text" name="name" required></div>
        <div class="field"><label>Fecha</label><input type="date" name="date" required></div>
        <div class="field"><label>Hora (opcional)</label><input type="time" name="time"></div>
      </div>
      <div class="field-grid">
        <div class="field"><label>Venue — nombre</label><input type="text" name="venueName"></div>
        <div class="field"><label>Venue — dirección</label><input type="text" name="venueAddress"></div>
        <div class="field"><label>Venue — link (Instagram, etc.)</label><input type="url" name="venueLink"></div>
      </div>
      <div class="field"><label>Link para comprar entradas</label><input type="url" name="ticketUrl"></div>
      <div class="field"><label>Bio / descripción</label><textarea name="description"></textarea></div>

      <div class="field">
        <label>Artistas</label>
        <div id="artistsList"></div>
        <button type="button" class="btn btn-sm list-add" id="addArtistBtn">+ Agregar artista</button>
      </div>

      <div class="field">
        <label>Otros links (reservas, menú, Facebook, etc.)</label>
        <div id="otherLinksList"></div>
        <button type="button" class="btn btn-sm list-add" id="addLinkBtn">+ Agregar link</button>
      </div>

      <div class="field">
        <label>Flyer</label>
        <div class="flyer-row">
          <img class="flyer-preview" id="flyerPreview" src="" alt="" style="display:none;">
          <input type="file" id="flyerInput" accept="image/*">
        </div>
      </div>

      <div class="field" style="flex-direction:row;align-items:center;gap:10px;">
        <label class="toggle"><input type="checkbox" name="active" id="activeToggle" checked><span class="toggle-slider"></span></label>
        <span style="font-size:13px;">Evento activo (visible en el sitio)</span>
      </div>

      <div style="display:flex;gap:10px;margin-top:10px;">
        <button type="submit" class="btn btn-accent">Guardar</button>
        <button type="button" class="btn" id="cancelFormBtn">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(function(){
  "use strict";
  var TOKEN_KEY = "sfEventsAdminToken";
  var token = localStorage.getItem(TOKEN_KEY) || "";
  var events = [];
  var editingId = null; // null = creating new
  var pendingFlyerFile = null;

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
    return fetch(path, opts);
  }

  function showToast(msg, danger){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = danger ? "danger" : "";
    t.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.hidden = true; }, 2600);
  }

  function checkToken(){
    return api("/api/events?admin=1").then(function(r){
      if (r.status === 401) return false;
      return r.json().then(function(list){ events = list; return true; });
    });
  }

  function enterApp(){
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").hidden = false;
    renderList();
  }

  document.getElementById("gateSubmit").addEventListener("click", function(){
    token = document.getElementById("gateToken").value.trim();
    checkToken().then(function(ok){
      if (ok){
        localStorage.setItem(TOKEN_KEY, token);
        enterApp();
      } else {
        document.getElementById("gateError").style.display = "block";
      }
    });
  });

  if (token){
    checkToken().then(function(ok){ if (ok) enterApp(); });
  }

  function typeLabel(){ return ""; }

  function renderList(){
    var tbody = document.getElementById("eventsTbody");
    tbody.innerHTML = "";
    events.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); }).forEach(function(ev){
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.textContent = ev.name;
      tr.appendChild(tdName);

      var tdDate = document.createElement("td");
      tdDate.textContent = ev.date + (ev.time ? " · " + ev.time : "");
      tr.appendChild(tdDate);

      var tdStatus = document.createElement("td");
      var pill = document.createElement("label");
      pill.className = "toggle";
      var chk = document.createElement("input");
      chk.type = "checkbox";
      chk.checked = !!ev.active;
      chk.addEventListener("change", function(){ toggleActive(ev.id, chk.checked); });
      var slider = document.createElement("span");
      slider.className = "toggle-slider";
      pill.appendChild(chk);
      pill.appendChild(slider);
      tdStatus.appendChild(pill);
      var statusText = document.createElement("span");
      statusText.style.marginLeft = "8px";
      statusText.style.fontSize = "12px";
      statusText.style.color = "var(--heading)";
      statusText.textContent = ev.active ? "Activo" : "Inactivo";
      tdStatus.appendChild(statusText);
      tr.appendChild(tdStatus);

      var tdActions = document.createElement("td");
      var actions = document.createElement("div");
      actions.className = "row-actions";
      var editBtn = document.createElement("button");
      editBtn.className = "btn btn-sm";
      editBtn.type = "button";
      editBtn.textContent = "Editar";
      editBtn.addEventListener("click", function(){ openForm(ev); });
      var delBtn = document.createElement("button");
      delBtn.className = "btn btn-sm btn-danger";
      delBtn.type = "button";
      delBtn.textContent = "Eliminar";
      delBtn.addEventListener("click", function(){ deleteEvent(ev); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      tdActions.appendChild(actions);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
  }

  function toggleActive(id, active){
    api("/api/events/" + id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ active: active }),
    }).then(function(r){ return r.json(); }).then(function(updated){
      var idx = events.findIndex(function(e){ return e.id === id; });
      if (idx !== -1) events[idx] = updated;
      renderList();
      showToast(active ? "Evento activado" : "Evento desactivado");
    }).catch(function(){ showToast("Error al actualizar", true); });
  }

  function deleteEvent(ev){
    if (!confirm("¿Eliminar \"" + ev.name + "\"? No se puede deshacer.")) return;
    api("/api/events/" + ev.id, { method: "DELETE" }).then(function(){
      events = events.filter(function(e){ return e.id !== ev.id; });
      renderList();
      showToast("Eliminado");
    }).catch(function(){ showToast("Error al eliminar", true); });
  }

  // ---------------- form ----------------
  var form = document.getElementById("eventForm");
  var formSection = document.getElementById("formSection");

  function addSubrow(container, placeholders, values){
    var row = document.createElement("div");
    row.className = "subrow";
    var input1 = document.createElement("input");
    input1.type = "text";
    input1.placeholder = placeholders[0];
    input1.value = (values && values[0]) || "";
    var input2 = document.createElement("input");
    input2.type = "text";
    input2.placeholder = placeholders[1];
    input2.value = (values && values[1]) || "";
    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "btn btn-sm";
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", function(){ row.remove(); });
    row.appendChild(input1);
    row.appendChild(input2);
    row.appendChild(removeBtn);
    container.appendChild(row);
    return row;
  }

  document.getElementById("addArtistBtn").addEventListener("click", function(){
    addSubrow(document.getElementById("artistsList"), ["Nombre del artista", "Link (Instagram, Spotify...)"]);
  });
  document.getElementById("addLinkBtn").addEventListener("click", function(){
    addSubrow(document.getElementById("otherLinksList"), ["Label (ej: Reservas)", "URL"]);
  });

  function readSubrows(container){
    return Array.from(container.querySelectorAll(".subrow")).map(function(row){
      var inputs = row.querySelectorAll("input");
      return [inputs[0].value.trim(), inputs[1].value.trim()];
    }).filter(function(pair){ return pair[0] || pair[1]; });
  }

  function openForm(ev){
    editingId = ev ? ev.id : null;
    pendingFlyerFile = null;
    document.getElementById("formTitle").textContent = ev ? "Editar evento" : "Nuevo evento";
    form.reset();
    document.getElementById("artistsList").innerHTML = "";
    document.getElementById("otherLinksList").innerHTML = "";
    var preview = document.getElementById("flyerPreview");
    document.getElementById("flyerInput").value = "";

    if (ev){
      form.name.value = ev.name || "";
      form.date.value = ev.date || "";
      form.time.value = ev.time || "";
      form.venueName.value = (ev.venue && ev.venue.name) || "";
      form.venueAddress.value = (ev.venue && ev.venue.address) || "";
      form.venueLink.value = (ev.venue && ev.venue.link) || "";
      form.ticketUrl.value = ev.ticketUrl || "";
      form.description.value = ev.description || "";
      document.getElementById("activeToggle").checked = ev.active !== false;
      (ev.artists || []).forEach(function(a){
        addSubrow(document.getElementById("artistsList"), ["Nombre del artista", "Link"], [a.name, a.link]);
      });
      (ev.otherLinks || []).forEach(function(l){
        addSubrow(document.getElementById("otherLinksList"), ["Label", "URL"], [l.label, l.url]);
      });
      if (ev.flyerKey){
        preview.src = "/api/flyers/" + ev.flyerKey;
        preview.style.display = "";
      } else {
        preview.style.display = "none";
      }
    } else {
      document.getElementById("activeToggle").checked = true;
      preview.style.display = "none";
    }
    formSection.hidden = false;
    formSection.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("newEventBtn").addEventListener("click", function(){ openForm(null); });
  document.getElementById("cancelFormBtn").addEventListener("click", function(){ formSection.hidden = true; });

  document.getElementById("flyerInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    pendingFlyerFile = file || null;
    var preview = document.getElementById("flyerPreview");
    if (file){
      preview.src = URL.createObjectURL(file);
      preview.style.display = "";
    }
  });

  function buildPayload(){
    return {
      name: form.name.value.trim(),
      date: form.date.value,
      time: form.time.value || undefined,
      venue: {
        name: form.venueName.value.trim(),
        address: form.venueAddress.value.trim(),
        link: form.venueLink.value.trim(),
      },
      ticketUrl: form.ticketUrl.value.trim() || undefined,
      description: form.description.value.trim(),
      artists: readSubrows(document.getElementById("artistsList")).map(function(p){ return { name: p[0], link: p[1] || undefined }; }),
      otherLinks: readSubrows(document.getElementById("otherLinksList")).map(function(p){ return { label: p[0], url: p[1] }; }),
      active: document.getElementById("activeToggle").checked,
    };
  }

  function uploadFlyerIfNeeded(id){
    if (!pendingFlyerFile) return Promise.resolve();
    return api("/api/events/" + id + "/flyer", {
      method: "POST",
      headers: { "Content-Type": pendingFlyerFile.type || "image/jpeg" },
      body: pendingFlyerFile,
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var payload = buildPayload();
    if (!payload.name || !payload.date){
      showToast("Falta nombre o fecha", true);
      return;
    }
    var req = editingId
      ? api("/api/events/" + editingId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      : api("/api/events", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });

    req.then(function(r){ return r.json(); }).then(function(saved){
      return uploadFlyerIfNeeded(saved.id).then(function(){ return saved; });
    }).then(function(){
      return checkToken();
    }).then(function(){
      renderList();
      formSection.hidden = true;
      showToast("Guardado");
    }).catch(function(){ showToast("Error al guardar", true); });
  });
})();
</script>

</body>
</html>
